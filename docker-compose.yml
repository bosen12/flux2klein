services:
  # Tailscale sidecar：面板／暗房／LoRA Manager 三個都共用這個網路命名空間，讓
  # 它們直接掛在 tailnet 上收封包（不經過 Docker NAT），三邊各自的「本機／
  # Tailscale 白名單」才能拿到真正的來源 IP。TS_AUTHKEY 從 .env 讀，見
  # .env.example；首次啟動會在 Tailscale 後台多一台叫 flux2klein-panel 的裝置。
  tailscale-panel:
    image: tailscale/tailscale:latest
    container_name: flux2klein-tailscale-panel
    hostname: flux2klein-panel
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale-panel-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "127.0.0.1:7801:7801"
      - "127.0.0.1:7860:7860"
      - "127.0.0.1:7861:7861"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 128m
    restart: unless-stopped

  panel:
    build:
      context: .
      dockerfile: docker/panel/Dockerfile
    image: flux2klein-panel
    container_name: flux2klein-panel
    working_dir: /app
    network_mode: "service:tailscale-panel"
    depends_on:
      - tailscale-panel
    volumes:
      - .:/app
      - E:/Comfyui/loras:/mnt/loras
      - C:/projects/special_prompts:/mnt/special_prompts
    environment:
      - LORA_ROOT=/mnt/loras
      - PROMPTS_ROOT=/mnt/special_prompts
    command: ["python", "serve.py", "host.docker.internal:8188", "7801"]
    mem_limit: 512m
    mem_reservation: 256m
    restart: unless-stopped

  darkroom:
    build:
      context: .
      dockerfile: docker/darkroom/Dockerfile
    image: flux2klein-darkroom
    container_name: flux2klein-darkroom
    working_dir: /app/darkroom
    network_mode: "service:tailscale-panel"
    depends_on:
      - tailscale-panel
    volumes:
      - .:/app
      - E:/Comfyui/loras:/mnt/loras
      - C:/ComfyUI/ComfyUI_windows_portable_nvidia/ComfyUI_windows_portable/ComfyUI/models/checkpoints:/mnt/checkpoints
      - C:/projects/special_prompts:/mnt/special_prompts
      - C:/Users/boshe/Downloads:/mnt/downloads:ro
    environment:
      - LORA_ROOT=/mnt/loras
      - DARKROOM_CHECKPOINT_ROOT=/mnt/checkpoints/illurtrious
    command:
      - python
      - preview_ui.py
      - --host
      - "0.0.0.0"
      - --port
      - "7860"
      - --comfy
      - "http://host.docker.internal:8188"
      - --special-dir
      - /mnt/special_prompts
      - --workflow
      - "/mnt/downloads/ANIMESTYLE (1).json"
      - --no-open
    mem_limit: 1g
    mem_reservation: 512m
    restart: unless-stopped

  lora-manager:
    build:
      context: .
      dockerfile: docker/lora-manager/Dockerfile
    image: flux2klein-lora-manager
    container_name: flux2klein-lora-manager
    working_dir: /app/lora-manager
    network_mode: "service:tailscale-panel"
    depends_on:
      - tailscale-panel
    volumes:
      - .:/app
      - E:/Comfyui/loras:/mnt/loras
      - C:/ComfyUI/ComfyUI_windows_portable_nvidia/ComfyUI_windows_portable/ComfyUI/models/checkpoints:/mnt/checkpoints
    environment:
      - LORA_ROOT=/mnt/loras
      - CHECKPOINT_ROOT=/mnt/checkpoints
    mem_limit: 1g
    mem_reservation: 512m
    restart: unless-stopped

volumes:
  tailscale-panel-state:
