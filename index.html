<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover：iOS 上沒有這個，env(safe-area-inset-*) 一律回 0，安全區的規則等於沒寫 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eceef5">
  <title>Flux2 Klein · ComfyUI 面板</title>
  <!-- SVG 優先（各尺寸都銳利）；不支援的瀏覽器才退回 png / ico -->
  <!-- 只留 SVG。同時宣告多個 icon 時瀏覽器會自行挑選，實測 Chrome 會挑走
       高解析度的 favicon.png（256×256），而那兩個點陣檔還是舊版設計，
       留著等於備了一條會顯示錯誤品牌的後路。
       ?v=1 由 serve.py 換成 mtime 雜湊——favicon 的快取特別頑固，沒版本號改了也不會換。 -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<div class="bg-fx" aria-hidden="true">
  <div id="vanta-bg"></div>
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="bg-noise"></span>
</div>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" id="brand-logo">
        <i class="logo-fill" id="logo-fill"></i>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 3.2 21 19.4H3.4L11 3.2Z"/>
          <path d="M2 9.4h6.4" opacity=".85"/>
          <path d="M14.6 12.6h7.6M14.2 15.4h6.2M13.8 9.8h7" opacity=".55"/>
        </svg>
      </div>
      <div><span id="brand-title">Flux2 Klein 面板</span><br><small id="brand-sub">文生圖 / 多圖編輯 / 局部重繪 / 圖像擴展</small></div>
    </div>
    <div class="engine-switch" id="engine-switch">
      <span class="engine-pill" id="engine-pill"></span>
      <button type="button" data-engine="flux2klein" class="active">Flux2 Klein</button>
      <button type="button" data-engine="zimage">Z-Image Turbo</button>
      <button type="button" data-engine="krea2">Krea2</button>
      <button type="button" data-engine="illustrious">Illustrious</button>
    </div>
    <!-- 助理不是第五個引擎：它自己不產圖，而是操作那四個，所以放在切換器外面、
         不參與 engine-pill 的滑動，也不會改 data-engine 主題色。 -->
    <button type="button" class="assistant-btn" id="assistant-btn"
            aria-expanded="false" aria-controls="assistant" aria-label="AI 助理"
            title="AI 助理（語音操作面板）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3a4 4 0 0 1 4 4v4a4 4 0 0 1-8 0V7a4 4 0 0 1 4-4Z"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
      </svg>
      <span>AI Assistant</span>
    </button>
    <!-- 詞庫暗房：獨立工具（darkroom/preview_ui.py），按鈕開新視窗，不嵌入面板 -->
    <button type="button" class="assistant-btn darkroom-btn" id="darkroom-btn"
            aria-label="詞庫暗房"
            title="詞庫暗房（開新視窗，需先啟動 darkroom/preview_ui.bat）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="8.5" cy="9.5" r="1.6"/><path d="m21 16-5-5L5 20"/>
      </svg>
      <span>詞庫暗房</span>
    </button>
    <div class="spacer"></div>
    <!-- 偏好開關的摺疊鈕：只在手機出現（桌面 CSS 設 display:none）。
         這三個開關是「設定一次就不再動」的偏好，在 375px 寬的螢幕上卻永久佔掉
         頂列一整行，所以手機收進來、要調再展開。 -->
    <button type="button" class="topbar-more" id="topbar-more"
            aria-expanded="false" aria-controls="toggle-inline" aria-label="顯示偏好開關">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
      </svg>
    </button>
    <div class="toggle-inline" id="toggle-inline">
      <label class="opt"><span>完成音效</span><span class="yz-switch"><input type="checkbox" id="opt-sound" checked><span class="yz-slider"></span><span class="yz-knob"></span></span></label>
      <label class="opt"><span>桌面通知</span><span class="yz-switch"><input type="checkbox" id="opt-notify"><span class="yz-slider"></span><span class="yz-knob"></span></span></label>
      <label class="opt"><span>即時預覽</span><span class="yz-switch"><input type="checkbox" id="opt-preview" checked><span class="yz-slider"></span><span class="yz-knob"></span></span></label>
    </div>
    <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">連線中…</span></div>
  </header>

  <div class="main">
    <!-- 左側：模式與輸入 -->
    <section class="left">
      <div class="tabs" id="tabs"></div>
      <div class="form" id="form">
        <div class="mode-desc" id="mode-desc"></div>

        <div class="field prompt-wrap">
          <label>提示詞 <span class="hint" id="prompt-hint"></span></label>
          <textarea id="prompt" placeholder="描述你想要的畫面 / 編輯指令…"></textarea>
          <button type="button" class="mic-btn" id="mic-btn" title="語音輸入（點一下開始／停止）" aria-label="語音輸入">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/>
            </svg>
          </button>
          <button type="button" class="ai-btn" id="ai-btn" title="AI 優化提示詞" aria-label="AI 優化提示詞">✦</button>
        </div>

        <!-- 圖片上傳（動態） -->
        <div class="field" id="images-field" style="display:none">
          <label>參考圖片 <span class="hint" id="images-hint"></span></label>
          <div class="uploads" id="uploads"></div>
        </div>

        <!-- 局部重繪：遮罩畫布 -->
        <div class="field" id="mask-field" style="display:none">
          <label>塗抹要重繪的區域 <span class="hint">白色 = 會被重新生成</span></label>
          <div class="mask-wrap">
            <div class="mask-stage" id="mask-stage"><span style="color:var(--text-faint);font-size:12px" id="mask-empty">先在上方上傳圖片</span></div>
            <div class="mask-tools">
              <span>筆刷</span>
              <input type="range" id="brush" min="8" max="120" value="45">
              <button class="btn-mini" id="mask-clear">清除</button>
              <!-- 標籤與輸入框包在一起：mask-tools 是會換行的 flex，兩者各自是 flex 項目時
                   手機上會被拆到不同行，變成一個沒有輸入框的標籤加一個沒有標籤的數字框 -->
              <span class="mask-grow">
                <label class="chk" for="grow"><span>擴張/羽化</span></label>
                <input type="number" id="grow" value="10" min="0" max="200" style="max-width:80px">
              </span>
            </div>
          </div>
        </div>

        <!-- 文生圖：尺寸 -->
        <div class="field" id="size-field" style="display:none">
          <label>尺寸</label>
          <div class="row">
            <input type="number" id="width" value="1024" min="256" max="4096" step="8">
            <input type="number" id="height" value="1024" min="256" max="4096" step="8">
          </div>
          <div class="toggle-inline" id="aspect-presets"></div>
        </div>

        <!-- 圖像擴展：邊界 -->
        <div class="field" id="pad-field" style="display:none">
          <label>擴展邊界（像素）</label>
          <div class="row">
            <div class="field"><label class="hint">左</label><input type="number" id="pad-left" value="504" min="0" step="8"></div>
            <div class="field"><label class="hint">右</label><input type="number" id="pad-right" value="504" min="0" step="8"></div>
            <div class="field"><label class="hint">上</label><input type="number" id="pad-top" value="0" min="0" step="8"></div>
            <div class="field"><label class="hint">下</label><input type="number" id="pad-bottom" value="0" min="0" step="8"></div>
            <div class="field"><label class="hint">羽化</label><input type="number" id="pad-feather" value="50" min="0" step="1"></div>
          </div>
        </div>

        <!-- Krea2：增強開關 -->
        <div class="field" id="enhance-field" style="display:none">
          <label>增強 <span class="hint">預設不開；開啟後可拉桿對照差別</span></label>
          <div class="enh-grid" id="enhance-list"></div>
          <div id="enh-tune"></div>
          <div id="ref-upload" style="display:none; margin-top:10px">
            <div class="uploads" id="uploads-ref"></div>
          </div>
        </div>

        <!-- Illustrious：LoRA 風格開關（單選；選單、預覽、觸發詞由 app.js 建） -->
        <div class="field" id="lora-field" style="display:none">
          <label class="lora-head" id="lora-toggle">
            <input type="checkbox" id="lora-on">
            <span class="lora-head-ic" aria-hidden="true">✦</span>
            <span class="lora-head-body">
              <span class="lora-head-name">LoRA 風格</span>
              <span class="lora-head-desc">套用畫風 LoRA，可挑觸發詞加進提示詞</span>
            </span>
            <span class="lora-head-sw"></span>
          </label>
          <div id="lora-panel" style="display:none"></div>
        </div>

        <!-- Illustrious：詞庫（special_prompts）單選；選單由 app.js 建 -->
        <div class="field" id="lib-field" style="display:none">
          <label class="lora-head" id="lib-toggle">
            <input type="checkbox" id="lib-on">
            <span class="lora-head-ic" aria-hidden="true">❖</span>
            <span class="lora-head-body">
              <span class="lora-head-name">詞庫</span>
              <span class="lora-head-desc">挑一個情境，正向自動填入、負向自動套用</span>
            </span>
            <span class="lora-head-sw"></span>
          </label>
          <div id="lib-panel" style="display:none"></div>
        </div>

        <div class="field" id="model-field">
          <label>模型 <span class="hint">Diffusion + Text Encoder（成套）</span></label>
          <select id="model-set">
            <option value="9b-mixed" data-unet="fluxKleinFP8_flux2Klein9bFp8.safetensors" data-clip="qwen_3_8b_fp8mixed.safetensors">Klein 9B · qwen_3_8b_fp8mixed</option>
            <option value="9b" data-unet="fluxKleinFP8_flux2Klein9bFp8.safetensors" data-clip="qwen_3_8b.safetensors">Klein 9B · qwen_3_8b</option>
            <option value="4b" data-unet="flux-2-klein-4b.safetensors" data-clip="qwen_3_4b_fp8_mixed.safetensors" selected>Klein 4B · qwen_3_4b_fp8_mixed</option>
          </select>
        </div>

        <div class="row">
          <div class="field">
            <label>步數 Steps</label>
            <input type="number" id="steps" value="4" min="1" max="60">
          </div>
          <div class="field">
            <label>批次數量</label>
            <input type="number" id="batch" value="1" min="1" max="16">
          </div>
        </div>

        <div class="field">
          <label>種子 Seed</label>
          <div class="seed-row">
            <input type="text" id="seed" value="9527">
            <button class="btn-mini" id="seed-rand" title="隨機">🎲 隨機</button>
            <label class="chk"><input type="checkbox" id="seed-fixed"> 固定</label>
          </div>
        </div>

        <div class="actions">
          <span class="beam-wrap"><button class="btn-run" id="run" data-state="idle" title="生成（Ctrl / ⌘ + Enter）">生成</button></span>
          <button class="btn-ghost" id="interrupt" title="中斷目前任務">中斷</button>
        </div>
      </div>
    </section>

    <!-- 右側：即時進度與結果 -->
    <section class="right">
      <div class="card idle" id="progress-card">
        <div class="card-head">⚡ 即時進度<span id="run-loader" class="run-loader"><svg viewBox="0 0 128 128" height="128" width="128" class="star">
  <defs>
    <filter id="star-glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <linearGradient y2="1" x2="0" y1="0" x1="0" id="star-grad">
      <stop stop-color="#000" offset="0%"></stop>
      <stop stop-color="#fff" offset="100%"></stop>
    </linearGradient>
    <mask id="star-mask">
      <rect fill="url(#star-grad)" height="128" width="128" y="0" x="0"></rect>
    </mask>
  </defs>
  <g
    stroke-width="2"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
  >
    <g class="star-ghost">
      <polygon
        points="64 49 66.322 58.992 71.071 56.929 69.008 61.678 79 64 69.008 66.322 71.071 71.071 66.322 69.008 64 79 61.678 69.008 56.929 71.071 58.992 66.322 49 64 58.992 61.678 56.929 56.929 61.678 58.992 64 49"

      ></polygon>
      <polygon
        points="64 4 73.287 43.966 92.284 35.716 84.034 54.713 124 64 84.034 73.287 92.284 92.284 73.287 84.034 64 124 54.713 84.034 35.716 92.284 43.966 73.287 4 64 43.966 54.713 35.716 35.716 54.713 43.966 64 4"

      <g class="star-main">
        <polygon
          points="64 49 66.322 58.992 71.071 56.929 69.008 61.678 79 64 69.008 66.322 71.071 71.071 66.322 69.008 64 79 61.678 69.008 56.929 71.071 58.992 66.322 49 64 58.992 61.678 56.929 56.929 61.678 58.992 64 49"

          stroke-dasharray="62 186"
          class="star__stroke star__stroke--2"
        ></polygon>
        <polygon
          points="64 19 70.966 48.975 85.213 42.787 79.025 57.034 109 64 79.025 70.966 85.213 85.213 70.966 79.025 64 109 57.034 79.025 42.787 85.213 48.975 70.966 19 64 48.975 57.034 42.787 42.787 57.034 48.975 64 19"
          stroke-dasharray="93 279"
          class="star__stroke star__stroke--3"
        ></polygon>
        <polygon
          points="64 4 73.287 43.966 92.284 35.716 84.034 54.713 124 64 84.034 73.287 92.284 92.284 73.287 84.034 64 124 54.713 84.034 35.716 92.284 43.966 73.287 4 64 43.966 54.713 35.716 35.716 54.713 43.966 64 4"
          stroke-dasharray="124 372"

        ></polygon>
      </g>
      <g mask="url(#star-mask)" class="star-alt">
        <polygon
          points="64 49 66.322 58.992 71.071 56.929 69.008 61.678 79 64 69.008 66.322 71.071 71.071 66.322 69.008 64 79 61.678 69.008 56.929 71.071 58.992 66.322 49 64 58.992 61.678 56.929 56.929 61.678 58.992 64 49"
          stroke-dasharray="31 93"
          class="star__stroke"
        ></polygon>
        <polygon
          points="64 34 68.644 53.983 78.142 49.858 74.017 59.356 94 64 74.017 68.644 78.142 78.142 68.644 74.017 64 94 59.356 74.017 49.858 78.142 53.983 68.644 34 64 53.983 59.356 49.858 49.858 59.356 53.983 64 34"
          stroke-dasharray="62 186"
          class="star__stroke star__stroke--2"
        ></polygon>
        <polygon
          points="64 19 70.966 48.975 85.213 42.787 79.025 57.034 109 64 79.025 70.966 85.213 85.213 70.966 79.025 64 109 57.034 79.025 42.787 85.213 48.975 70.966 19 64 48.975 57.034 42.787 42.787 57.034 48.975 64 19"
          stroke-dasharray="93 279"
          class="star__stroke star__stroke--3"
        ></polygon>
        <polygon
          points="64 4 73.287 43.966 92.284 35.716 84.034 54.713 124 64 84.034 73.287 92.284 92.284 73.287 84.034 64 124 54.713 84.034 35.716 92.284 43.966 73.287 4 64 43.966 54.713 35.716 35.716 54.713 43.966 64 4"

  </g>
</svg></span></div>
        <div class="card-body">
          <div class="idle-hint">填好左側設定後按「生成」<kbd>Ctrl / ⌘ + Enter</kbd>，這裡會顯示即時進度、速度與剩餘時間。</div>
          <div class="progress-top">
            <div class="progress-pct" id="pct">0%</div>
            <div class="progress-stage" id="stage">閒置中</div>
          </div>
          <div class="bar"><i id="bar-fill"></i></div>
          <ol class="pipeline" id="pipeline" aria-label="執行階段"></ol>
          <div class="metrics">
            <div class="metric"><div class="k">速度</div><div class="v" id="m-speed">–</div></div>
            <div class="metric"><div class="k">剩餘時間 ETA</div><div class="v" id="m-eta">–</div></div>
            <div class="metric"><div class="k">步數</div><div class="v" id="m-step">–</div></div>
          </div>
          <div class="preview-live" id="preview-live"><img id="preview-img" alt="即時預覽"></div>
        </div>
      </div>

      <div class="card" id="compare-card" style="display:none">
        <div class="card-head">🔍 前後對照（拖曳中間分隔線）</div>
        <div class="card-body"><div id="compare"></div></div>
      </div>

      <div class="card">
        <div class="card-head">🖼️ 生成結果<button type="button" class="head-btn" id="gallery-clear" title="清除所有結果">清除</button></div>
        <div class="card-body"><div class="gallery" id="gallery"></div></div>
      </div>

      <div class="card collapsible collapsed" id="log-card">
        <div class="card-head" id="log-head" role="button" tabindex="0" aria-expanded="false" aria-controls="log">📜 日誌<span class="head-caret">▾</span></div>
        <div class="card-body"><div class="log" id="log"></div></div>
      </div>
    </section>
  </div>
</div>

<!-- AI 助理抽屜。刻意不加背景遮罩：它的價值是「你說話、面板動起來」，
     遮住面板就看不到成果，所以面板保持可見且可操作。 -->
<aside class="assistant" id="assistant" aria-label="AI 助理" inert>
  <header class="asst-head">
    <span class="asst-dot" id="asst-dot" aria-hidden="true"></span>
    <div>
      <strong id="asst-title">AI 助理</strong>
      <small id="asst-state">尚未啟動</small>
    </div>
    <button type="button" class="asst-close" id="asst-close" title="關閉助理">✕</button>
  </header>

  <!-- 模式切換。助理＝能操作面板生圖；女友＝純陪聊、不送工具，也就不會動面板、
       不生圖，語音／對嘴可以獨佔顯存。切換時重送 session.update 換人格與工具。 -->
  <div class="asst-modes" id="asst-modes" role="group" aria-label="助理模式">
    <button type="button" data-mode="assistant" class="active">AI 助理</button>
    <button type="button" data-mode="girlfriend">女友</button>
  </div>

  <!-- 頭像舞台：徑向遮罩讓周圍背景淡化融進抽屜；講話時由音量驅動光暈與脈動。
       之後接 MuseTalk 時，把 <img> 換成影像串流即可，容器與接線不動。 -->
  <div class="asst-avatar" id="asst-avatar" aria-hidden="true">
    <div class="asst-avatar-inner">
      <span class="asst-avatar-ring" id="asst-avatar-ring"></span>
      <img id="asst-avatar-img" src="/assets/avatar.png?v=1" alt="">
      <!-- 對嘴影像：LiveTalking 有跑時才會連上並蓋掉靜態頭像（見 app.js 的 ltConnect）-->
      <video id="asst-avatar-video" autoplay playsinline></video>
      <span class="asst-avatar-glow" id="asst-avatar-glow"></span>
    </div>
  </div>

  <div class="asst-log" id="asst-log" role="log" aria-live="polite">
    <p class="asst-empty">直接打字，或按「開始聆聽」用說的。例如：<br>
      「用 Illustrious 畫一個抱著吉他的少女，直式」</p>
  </div>

  <footer class="asst-foot">
    <div class="asst-type">
      <input type="text" id="asst-input" placeholder="打字問助理…（Enter 送出）"
             autocomplete="off" aria-label="輸入訊息給助理">
      <button type="button" class="asst-send" id="asst-send" title="送出" aria-label="送出">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12h15M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>
    <div class="asst-mic-row">
      <button type="button" class="asst-mic" id="asst-mic">
        <span class="asst-mic-icon" aria-hidden="true"></span>
        <span id="asst-mic-label">開始聆聽</span>
      </button>
      <div class="asst-level" id="asst-level" aria-hidden="true"><i></i></div>
    </div>
  </footer>
</aside>

<div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>

<script src="three.min.js?v=1"></script>
<script src="vanta.fog.min.js?v=1"></script>
<script src="config.js?v=1"></script>
<script src="converter.js?v=1"></script>
<script src="zimage.js?v=1"></script>
<script src="krea2.js?v=1"></script>
<script src="illustrious.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
