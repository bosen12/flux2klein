<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flux2 Klein · ComfyUI 面板</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" id="brand-logo">✦</div>
      <div><span id="brand-title">Flux2 Klein 面板</span><br><small id="brand-sub">文生圖 / 單雙三圖編輯 / 局部重繪 / 圖像擴展</small></div>
    </div>
    <div class="engine-switch" id="engine-switch">
      <span class="engine-pill" id="engine-pill"></span>
      <button type="button" data-engine="flux2klein" class="active">Flux2 Klein</button>
      <button type="button" data-engine="zimage">Z-Image Turbo</button>
    </div>
    <div class="spacer"></div>
    <div class="toggle-inline">
      <label class="opt"><span>完成音效</span><span class="yz-switch"><input type="checkbox" id="opt-sound" checked><span class="yz-slider"></span><span class="yz-knob"></span></span></label>
      <label class="opt"><span>桌面通知</span><span class="yz-switch"><input type="checkbox" id="opt-notify"><span class="yz-slider"></span><span class="yz-knob"></span></span></label>
      <label class="opt"><span>即時預覽</span><span class="yz-switch"><input type="checkbox" id="opt-preview" checked><span class="yz-slider"></span><span class="yz-knob"></span></span></label>
    </div>
    <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">連線中…</span></div>
  </header>

  <div class="main">
    <!-- 左側：模式與輸入 -->
    <section class="left">
      <div class="tabs" id="tabs"></div>
      <div class="form" id="form">
        <div class="mode-desc" id="mode-desc"></div>

        <div class="field">
          <label>提示詞 <span class="hint" id="prompt-hint"></span></label>
          <textarea id="prompt" placeholder="描述你想要的畫面 / 編輯指令…"></textarea>
        </div>

        <!-- 圖片上傳（動態） -->
        <div class="field" id="images-field" style="display:none">
          <label>參考圖片 <span class="hint" id="images-hint"></span></label>
          <div class="uploads" id="uploads"></div>
        </div>

        <!-- 局部重繪：遮罩畫布 -->
        <div class="field" id="mask-field" style="display:none">
          <label>塗抹要重繪的區域 <span class="hint">白色 = 會被重新生成</span></label>
          <div class="mask-wrap">
            <div class="mask-stage" id="mask-stage"><span style="color:var(--text-faint);font-size:12px" id="mask-empty">先在上方上傳圖片</span></div>
            <div class="mask-tools">
              <span>筆刷</span>
              <input type="range" id="brush" min="8" max="120" value="45">
              <button class="btn-mini" id="mask-clear">清除</button>
              <label class="chk"><span>擴張/羽化</span></label>
              <input type="number" id="grow" value="10" min="0" max="200" style="max-width:80px">
            </div>
          </div>
        </div>

        <!-- 文生圖：尺寸 -->
        <div class="field" id="size-field" style="display:none">
          <label>尺寸</label>
          <div class="row">
            <input type="number" id="width" value="1024" min="256" max="4096" step="8">
            <input type="number" id="height" value="1024" min="256" max="4096" step="8">
          </div>
          <div class="toggle-inline" id="aspect-presets"></div>
        </div>

        <!-- 圖像擴展：邊界 -->
        <div class="field" id="pad-field" style="display:none">
          <label>擴展邊界（像素）</label>
          <div class="row">
            <div class="field"><label class="hint">左</label><input type="number" id="pad-left" value="504" min="0" step="8"></div>
            <div class="field"><label class="hint">右</label><input type="number" id="pad-right" value="504" min="0" step="8"></div>
            <div class="field"><label class="hint">上</label><input type="number" id="pad-top" value="0" min="0" step="8"></div>
            <div class="field"><label class="hint">下</label><input type="number" id="pad-bottom" value="0" min="0" step="8"></div>
            <div class="field"><label class="hint">羽化</label><input type="number" id="pad-feather" value="50" min="0" step="1"></div>
          </div>
        </div>

        <div class="field">
          <label>模型 <span class="hint">Diffusion + Text Encoder（成套）</span></label>
          <select id="model-set">
            <option value="9b-mixed" data-unet="fluxKleinFP8_flux2Klein9bFp8.safetensors" data-clip="qwen_3_8b_fp8mixed.safetensors">Klein 9B · qwen_3_8b_fp8mixed</option>
            <option value="9b" data-unet="fluxKleinFP8_flux2Klein9bFp8.safetensors" data-clip="qwen_3_8b.safetensors">Klein 9B · qwen_3_8b</option>
            <option value="4b" data-unet="flux-2-klein-4b.safetensors" data-clip="qwen_3_4b_fp8_mixed.safetensors" selected>Klein 4B · qwen_3_4b_fp8_mixed</option>
          </select>
        </div>

        <div class="row">
          <div class="field">
            <label>步數 Steps</label>
            <input type="number" id="steps" value="4" min="1" max="60">
          </div>
          <div class="field">
            <label>批次數量</label>
            <input type="number" id="batch" value="1" min="1" max="16">
          </div>
        </div>

        <div class="field">
          <label>種子 Seed</label>
          <div class="seed-row">
            <input type="text" id="seed" value="9527">
            <button class="btn-mini" id="seed-rand" title="隨機">🎲 隨機</button>
            <label class="chk"><input type="checkbox" id="seed-fixed"> 固定</label>
          </div>
        </div>

        <div class="actions">
          <button class="btn-run" id="run">生成</button>
          <button class="btn-ghost" id="interrupt" title="中斷目前任務">中斷</button>
        </div>
      </div>
    </section>

    <!-- 右側：即時進度與結果 -->
    <section class="right">
      <div class="card">
        <div class="card-head">⚡ 即時進度<span id="run-loader" class="run-loader"><svg viewBox="0 0 128 128" height="128" width="128" class="star">
  <defs>
    <filter id="star-glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <linearGradient y2="1" x2="0" y1="0" x1="0" id="star-grad">
      <stop stop-color="#000" offset="0%"></stop>
      <stop stop-color="#fff" offset="100%"></stop>
    </linearGradient>
    <mask id="star-mask">
      <rect fill="url(#star-grad)" height="128" width="128" y="0" x="0"></rect>
    </mask>
  </defs>
  <g
    stroke-width="2"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
  >
    <g stroke="rgba(79,70,229,0.18)">
      <polygon
        points="64 49 66.322 58.992 71.071 56.929 69.008 61.678 79 64 69.008 66.322 71.071 71.071 66.322 69.008 64 79 61.678 69.008 56.929 71.071 58.992 66.322 49 64 58.992 61.678 56.929 56.929 61.678 58.992 64 49"
      ></polygon>
      <polygon
        points="64 34 68.644 53.983 78.142 49.858 74.017 59.356 94 64 74.017 68.644 78.142 78.142 68.644 74.017 64 94 59.356 74.017 49.858 78.142 53.983 68.644 34 64 53.983 59.356 49.858 49.858 59.356 53.983 64 34"
      ></polygon>
      <polygon
        points="64 19 70.966 48.975 85.213 42.787 79.025 57.034 109 64 79.025 70.966 85.213 85.213 70.966 79.025 64 109 57.034 79.025 42.787 85.213 48.975 70.966 19 64 48.975 57.034 42.787 42.787 57.034 48.975 64 19"
      ></polygon>
      <polygon
        points="64 4 73.287 43.966 92.284 35.716 84.034 54.713 124 64 84.034 73.287 92.284 92.284 73.287 84.034 64 124 54.713 84.034 35.716 92.284 43.966 73.287 4 64 43.966 54.713 35.716 35.716 54.713 43.966 64 4"
      ></polygon>
    </g>
    <g filter="url(#star-glow)">
      <g stroke="#4f46e5">
        <polygon
          points="64 49 66.322 58.992 71.071 56.929 69.008 61.678 79 64 69.008 66.322 71.071 71.071 66.322 69.008 64 79 61.678 69.008 56.929 71.071 58.992 66.322 49 64 58.992 61.678 56.929 56.929 61.678 58.992 64 49"
          stroke-dasharray="31 93"
          class="star__stroke"
        ></polygon>
        <polygon
          points="64 34 68.644 53.983 78.142 49.858 74.017 59.356 94 64 74.017 68.644 78.142 78.142 68.644 74.017 64 94 59.356 74.017 49.858 78.142 53.983 68.644 34 64 53.983 59.356 49.858 49.858 59.356 53.983 64 34"
          stroke-dasharray="62 186"
          class="star__stroke star__stroke--2"
        ></polygon>
        <polygon
          points="64 19 70.966 48.975 85.213 42.787 79.025 57.034 109 64 79.025 70.966 85.213 85.213 70.966 79.025 64 109 57.034 79.025 42.787 85.213 48.975 70.966 19 64 48.975 57.034 42.787 42.787 57.034 48.975 64 19"
          stroke-dasharray="93 279"
          class="star__stroke star__stroke--3"
        ></polygon>
        <polygon
          points="64 4 73.287 43.966 92.284 35.716 84.034 54.713 124 64 84.034 73.287 92.284 92.284 73.287 84.034 64 124 54.713 84.034 35.716 92.284 43.966 73.287 4 64 43.966 54.713 35.716 35.716 54.713 43.966 64 4"
          stroke-dasharray="124 372"
          class="star__stroke star__stroke--4"
        ></polygon>
      </g>
      <g mask="url(#star-mask)" stroke="#0ea5a4">
        <polygon
          points="64 49 66.322 58.992 71.071 56.929 69.008 61.678 79 64 69.008 66.322 71.071 71.071 66.322 69.008 64 79 61.678 69.008 56.929 71.071 58.992 66.322 49 64 58.992 61.678 56.929 56.929 61.678 58.992 64 49"
          stroke-dasharray="31 93"
          class="star__stroke"
        ></polygon>
        <polygon
          points="64 34 68.644 53.983 78.142 49.858 74.017 59.356 94 64 74.017 68.644 78.142 78.142 68.644 74.017 64 94 59.356 74.017 49.858 78.142 53.983 68.644 34 64 53.983 59.356 49.858 49.858 59.356 53.983 64 34"
          stroke-dasharray="62 186"
          class="star__stroke star__stroke--2"
        ></polygon>
        <polygon
          points="64 19 70.966 48.975 85.213 42.787 79.025 57.034 109 64 79.025 70.966 85.213 85.213 70.966 79.025 64 109 57.034 79.025 42.787 85.213 48.975 70.966 19 64 48.975 57.034 42.787 42.787 57.034 48.975 64 19"
          stroke-dasharray="93 279"
          class="star__stroke star__stroke--3"
        ></polygon>
        <polygon
          points="64 4 73.287 43.966 92.284 35.716 84.034 54.713 124 64 84.034 73.287 92.284 92.284 73.287 84.034 64 124 54.713 84.034 35.716 92.284 43.966 73.287 4 64 43.966 54.713 35.716 35.716 54.713 43.966 64 4"
          stroke-dasharray="124 372"
          class="star__stroke star__stroke--4"
        ></polygon>
      </g>
    </g>
  </g>
</svg></span></div>
        <div class="card-body">
          <div class="progress-top">
            <div class="progress-pct" id="pct">0%</div>
            <div class="progress-stage" id="stage">閒置中</div>
          </div>
          <div class="bar"><i id="bar-fill"></i></div>
          <div class="metrics">
            <div class="metric"><div class="k">速度</div><div class="v" id="m-speed">–</div></div>
            <div class="metric"><div class="k">剩餘時間 ETA</div><div class="v" id="m-eta">–</div></div>
            <div class="metric"><div class="k">步數</div><div class="v" id="m-step">–</div></div>
          </div>
          <div class="preview-live" id="preview-live"><img id="preview-img" alt="即時預覽"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">🖼️ 生成結果</div>
        <div class="card-body"><div class="gallery" id="gallery"></div></div>
      </div>

      <div class="card">
        <div class="card-head">📜 日誌</div>
        <div class="card-body"><div class="log" id="log"></div></div>
      </div>
    </section>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>

<script src="converter.js"></script>
<script src="zimage.js"></script>
<script src="app.js"></script>
</body>
</html>
