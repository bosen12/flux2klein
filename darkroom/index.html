<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>詞庫暗房 · Special Prompts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23eaad57' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cline x1='14.31' y1='8' x2='20.05' y2='17.94'/%3E%3Cline x1='9.69' y1='8' x2='21.17' y2='8'/%3E%3Cline x1='7.38' y1='12' x2='13.12' y2='2.06'/%3E%3Cline x1='9.69' y1='16' x2='3.95' y2='6.06'/%3E%3Cline x1='14.31' y1='16' x2='2.83' y2='16'/%3E%3Cline x1='16.62' y1='12' x2='10.88' y2='21.94'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/darkroom.css">
</head>
<body>
<div id="boot">
  <div class="boot-logo">
    <span class="boot-ring"></span><span class="boot-ring slow"></span>
    <svg class="boot-ap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="14.31" y1="8" x2="20.05" y2="17.94"/><line x1="9.69" y1="8" x2="21.17" y2="8"/><line x1="7.38" y1="12" x2="13.12" y2="2.06"/><line x1="9.69" y1="16" x2="3.95" y2="6.06"/><line x1="14.31" y1="16" x2="2.83" y2="16"/><line x1="16.62" y1="12" x2="10.88" y2="21.94"/></svg>
  </div>
  <div class="boot-title">詞庫暗房</div>
  <div class="boot-bar"></div>
  <div class="boot-sub">沖洗中…</div>
</div>
<div class="topbar">
  <button class="menu-btn ghost" id="menu-btn" aria-label="開關資料夾列">☰</button>
  <div class="brand">
    <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-label="詞庫暗房"><circle cx="12" cy="12" r="10"/><line x1="14.31" y1="8" x2="20.05" y2="17.94"/><line x1="9.69" y1="8" x2="21.17" y2="8"/><line x1="7.38" y1="12" x2="13.12" y2="2.06"/><line x1="9.69" y1="16" x2="3.95" y2="6.06"/><line x1="14.31" y1="16" x2="2.83" y2="16"/><line x1="16.62" y1="12" x2="10.88" y2="21.94"/></svg>
    <h1>詞庫暗房</h1>
    <span class="sub" id="total-tag">…</span>
    <span class="dataset" id="dataset" title="目前操作的詞庫資料夾（生成／改名都作用在這裡）"></span>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="search" placeholder="跨資料夾搜尋名稱…" autocomplete="off">
  </div>
  <!-- 瀏覽專屬控制項放在 spacer 之前：切模式時它們出現/消失只改變 spacer 寬度，
       不會推動 spacer 之後靠右錨定的共用群組（模式切換/抽卡/重掃/連線），共用按鈕位置不動。 -->
  <label class="steps-field browse-only" title="生成步數（套用到之後的生成）">
    <span>步數</span>
    <input type="number" id="steps-input" min="1" max="150" step="1" value="25" inputmode="numeric">
  </label>
  <button class="ghost browse-only" id="review-btn" title="進入選取模式：點卡片標記不優質（紅叉）">🚩 篩選<span id="flag-count" class="flag-count"></span></button>
  <div class="spacer"></div>
  <!-- 以下為兩模式共用、位置固定：切模式時寬度不變、不位移 -->
  <div class="seg mode-seg" id="mode-seg" role="group" aria-label="模式">
    <span class="seg-pill" id="mode-pill" aria-hidden="true"></span>
    <button data-mode="browse" class="on" title="瀏覽與生成預覽圖">✦ 瀏覽</button>
    <button data-mode="tag" title="大量標稀有度">🏷 打標</button>
  </div>
  <button class="ghost" id="draw-cards" title="隨機抽卡（瀏覽=看圖；打標=逐張標稀有度）">✦ 抽卡</button>
  <button class="ghost" id="rescan" title="重新掃描">↻ 重掃</button>
  <div class="conn" id="conn"><span class="led"></span><span id="conn-text">…</span></div>
</div>

<div class="body">
  <nav class="rail" id="rail" aria-label="資料夾">
    <div class="rail-head">
      <span>資料夾 · Chapters</span>
      <button id="rail-sort" class="rail-sort" title="切換升冪／降冪排序">升冪 ↑</button>
    </div>
    <div class="rail-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="folder-search" placeholder="搜尋資料夾…" autocomplete="off">
      <button id="folder-search-clear" aria-label="清除" title="清除" style="display:none;">✕</button>
    </div>
    <div id="rail-list"></div>
    <div id="rail-empty" class="rail-empty" style="display:none;">找不到符合的資料夾</div>
  </nav>

  <main class="main" id="main">
    <div class="main-head">
      <div>
        <div class="main-title"><span class="num" id="mt-num"></span><h2 id="mt-name">載入中…</h2></div>
        <div class="main-sub" id="mt-sub"></div>
      </div>
      <div class="head-actions">
        <div class="seg browse-only" id="view-seg" role="group" aria-label="篩選">
          <span class="seg-pill" id="seg-pill" aria-hidden="true"></span>
          <button data-v="all" class="on">全部</button>
          <button data-v="missing">缺圖</button>
          <button data-v="have">已有</button>
        </div>
        <div class="gen-group browse-only">
          <span class="gen-label">本頁</span>
          <button class="primary" id="gen-page-missing">補缺少</button>
          <button class="ghost" id="gen-page-all">全部重生</button>
        </div>
        <div class="gen-group browse-only">
          <span class="gen-label">全部</span>
          <button class="primary" id="gen-all-missing">補缺少</button>
          <button class="ghost" id="gen-all-regen">全部重生</button>
        </div>
        <button class="danger browse-only" id="batch-stop" style="display:none;">停止</button>
        <span class="conn browse-only" id="batch-progress" style="font-family:var(--mono);"></span>
        <!-- 打標模式的主區操作（全選/清除選取）；Stage 2 會接上邏輯 -->
        <button class="ghost tag-only" id="sel-all">全選本資料夾</button>
        <button class="ghost tag-only" id="sel-clear">清除選取</button>
      </div>
    </div>
    <div class="coverbar" id="coverbar"><span style="width:0"></span></div>
    <div class="rarity-bar" id="rarity-bar" aria-label="稀有度篩選"></div>
    <div id="grid" class="grid"></div>
  </main>
</div>

<div id="modal" class="modal">
  <button class="m-nav prev" id="m-prev" aria-label="上一個">‹</button>
  <div class="modal-inner" id="modal-inner"></div>
  <button class="m-nav next" id="m-next" aria-label="下一個">›</button>
</div>

<!-- 抽卡：從全部隨機抽 5 張，塔羅式發牌 + 翻牌呈現 -->
<div id="tarot" class="tarot-overlay">
  <div class="tarot-stage">
    <div class="tarot-head">
      <span class="tarot-title">✦ 抽選八張 ✦</span>
      <div class="tarot-actions">
        <button class="primary" id="tarot-redraw">再抽一次 (R)</button>
        <button id="tarot-close">關閉 (Esc)</button>
      </div>
    </div>
    <div class="tarot-cards" id="tarot-cards"></div>
    <div class="tarot-hint">點任一張看大圖與提示詞；R 重抽一批、Esc 關閉</div>
  </div>
</div>
<script src="/darkroom.js" defer></script>
</body>
</html>
